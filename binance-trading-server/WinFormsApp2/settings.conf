# =================================================================
#   币安交易助手 Pro 配置文件 (settings.conf)
# =================================================================

# 1. 订阅与交易币种配置 (多个币种用英文逗号分隔，如: BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT)
Symbols = BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT

# 2. K线周期 (可选: 1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 6h, 8h, 12h, 1d, 3d, 1w, 1M)
KlineInterval = 1m

# 3. 实盘模式与 API 凭据配置 (IsLiveTrading: false = 本地模拟挂单 / 回测, true = 币安真实 API 下单)
IsLiveTrading = false
ApiKey = YOUR_BINANCE_API_KEY
ApiSecret = YOUR_BINANCE_API_SECRET
Leverage = 20
OrderQuantityUsdt = 1

# 4. 数据回播开始与结束日期 (格式: yyyy-MM-dd)
StartDate = 2026-08-14
EndDate = 2026-08-15

# 5. 回播间隔毫秒数 (建议: 500)
PlaybackIntervalMs = 500

# 6. 开关控制 (true / false)
EnableTickPush = true
AutoFitPrice = true
HighlightHighVolume = true

# 7. 趋势线回调策略参数设置
EnableStrategy = true
EnableWarmup = true
MinLineX1X2 = 40
MinLineAge = 80
TakeProfitPct = 1.5
StopLossPct = 0.8

# 8. 事件合约策略参数设置 (按固定时间 10m / 30m / 1h 判定多空交割)
EnableEventContract = false
EventContractDuration = 10m
EventContractEarlyExit = false
